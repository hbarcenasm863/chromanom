<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320">
<!-- Marca de agua de ChromaNom: moléculas reales en fórmula esqueletal,
     coloreadas con el código MDEC:
     verde = cadena principal · turquesa = ramificación ·
     dorado = insaturación · rosa = grupo funcional.
     Dos columnas intercaladas; cada molécula tiene su propio espacio y el
     patrón se repite (ver chromanom.css) sin que ninguna se cruce con otra. -->
<g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" font-family="Outfit, Arial, sans-serif" font-weight="700" font-size="26">
  <!-- 2-metilpentano -->
  <g class="mol" transform="translate(36 70) rotate(-8)">
    <polyline points="0,40 44,15 88,40 132,15 176,40" stroke="#166534"/>
    <line x1="44" y1="15" x2="44" y2="-35" stroke="#0891b2"/>
  </g>
  <!-- pent-2-eno -->
  <g class="mol" transform="translate(70 230) rotate(6)">
    <polyline points="0,15 44,40" stroke="#166534"/>
    <line x1="44" y1="40" x2="88" y2="15" stroke="#b45309"/>
    <line x1="49" y1="49" x2="91" y2="25" stroke="#b45309"/>
    <polyline points="88,15 132,40 176,15" stroke="#166534"/>
  </g>
  <!-- benceno -->
  <g class="mol" transform="translate(110 380) rotate(0)">
    <polygon points="44,0 82,22 82,66 44,88 6,66 6,22" stroke="#166534"/>
    <circle cx="44" cy="44" r="25" stroke="#CC79A7"/>
  </g>
  <!-- butan-2-ol -->
  <g class="mol" transform="translate(30 590) rotate(-5)">
    <polyline points="0,40 44,15 88,40 132,15" stroke="#166534"/>
    <line x1="44" y1="15" x2="44" y2="-25" stroke="#CC79A7"/>
    <text x="28" y="-34" fill="#CC79A7" stroke="none">OH</text>
  </g>
  <!-- ácido propanoico -->
  <g class="mol" transform="translate(150 740) rotate(4)">
    <polyline points="0,40 44,15 88,40" stroke="#166534"/>
    <line x1="88" y1="40" x2="88" y2="-5" stroke="#CC79A7"/>
    <line x1="98" y1="40" x2="98" y2="-5" stroke="#CC79A7"/>
    <line x1="88" y1="40" x2="128" y2="63" stroke="#CC79A7"/>
    <text x="84" y="-14" fill="#CC79A7" stroke="none">O</text>
    <text x="132" y="78" fill="#CC79A7" stroke="none">OH</text>
  </g>
  <!-- metilciclohexano -->
  <g class="mol" transform="translate(40 910) rotate(-10)">
    <polygon points="44,0 82,22 82,66 44,88 6,66 6,22" stroke="#166534"/>
    <line x1="82" y1="22" x2="124" y2="0" stroke="#0891b2"/>
  </g>
  <!-- butan-2-ona -->
  <g class="mol" transform="translate(170 1080) rotate(8)">
    <polyline points="0,40 44,15 88,40 132,15" stroke="#166534"/>
    <line x1="39" y1="15" x2="39" y2="-30" stroke="#CC79A7"/>
    <line x1="49" y1="15" x2="49" y2="-30" stroke="#CC79A7"/>
    <text x="34" y="-38" fill="#CC79A7" stroke="none">O</text>
  </g>
  <!-- but-2-ino -->
  <g class="mol" transform="translate(30 1230) rotate(-4)">
    <line x1="0" y1="20" x2="44" y2="20" stroke="#166534"/>
    <line x1="44" y1="20" x2="100" y2="20" stroke="#b45309"/>
    <line x1="44" y1="10" x2="100" y2="10" stroke="#b45309"/>
    <line x1="44" y1="30" x2="100" y2="30" stroke="#b45309"/>
    <line x1="100" y1="20" x2="144" y2="20" stroke="#166534"/>
  </g>
  <!-- benceno -->
  <g class="mol" transform="translate(470 70) rotate(0)">
    <polygon points="44,0 82,22 82,66 44,88 6,66 6,22" stroke="#166534"/>
    <circle cx="44" cy="44" r="25" stroke="#CC79A7"/>
  </g>
  <!-- 2-metilpentano -->
  <g class="mol" transform="translate(420 300) rotate(6)">
    <polyline points="0,40 44,15 88,40 132,15 176,40" stroke="#166534"/>
    <line x1="44" y1="15" x2="44" y2="-35" stroke="#0891b2"/>
  </g>
  <!-- but-2-ino -->
  <g class="mol" transform="translate(470 430) rotate(3)">
    <line x1="0" y1="20" x2="44" y2="20" stroke="#166534"/>
    <line x1="44" y1="20" x2="100" y2="20" stroke="#b45309"/>
    <line x1="44" y1="10" x2="100" y2="10" stroke="#b45309"/>
    <line x1="44" y1="30" x2="100" y2="30" stroke="#b45309"/>
    <line x1="100" y1="20" x2="144" y2="20" stroke="#166534"/>
  </g>
  <!-- ácido propanoico -->
  <g class="mol" transform="translate(420 540) rotate(-4)">
    <polyline points="0,40 44,15 88,40" stroke="#166534"/>
    <line x1="88" y1="40" x2="88" y2="-5" stroke="#CC79A7"/>
    <line x1="98" y1="40" x2="98" y2="-5" stroke="#CC79A7"/>
    <line x1="88" y1="40" x2="128" y2="63" stroke="#CC79A7"/>
    <text x="84" y="-14" fill="#CC79A7" stroke="none">O</text>
    <text x="132" y="78" fill="#CC79A7" stroke="none">OH</text>
  </g>
  <!-- pent-2-eno -->
  <g class="mol" transform="translate(450 700) rotate(-6)">
    <polyline points="0,15 44,40" stroke="#166534"/>
    <line x1="44" y1="40" x2="88" y2="15" stroke="#b45309"/>
    <line x1="49" y1="49" x2="91" y2="25" stroke="#b45309"/>
    <polyline points="88,15 132,40 176,15" stroke="#166534"/>
  </g>
  <!-- butan-2-ona -->
  <g class="mol" transform="translate(430 880) rotate(-6)">
    <polyline points="0,40 44,15 88,40 132,15" stroke="#166534"/>
    <line x1="39" y1="15" x2="39" y2="-30" stroke="#CC79A7"/>
    <line x1="49" y1="15" x2="49" y2="-30" stroke="#CC79A7"/>
    <text x="34" y="-38" fill="#CC79A7" stroke="none">O</text>
  </g>
  <!-- metilciclohexano -->
  <g class="mol" transform="translate(500 990) rotate(8)">
    <polygon points="44,0 82,22 82,66 44,88 6,66 6,22" stroke="#166534"/>
    <line x1="82" y1="22" x2="124" y2="0" stroke="#0891b2"/>
  </g>
  <!-- butan-2-ol -->
  <g class="mol" transform="translate(440 1170) rotate(5)">
    <polyline points="0,40 44,15 88,40 132,15" stroke="#166534"/>
    <line x1="44" y1="15" x2="44" y2="-25" stroke="#CC79A7"/>
    <text x="28" y="-34" fill="#CC79A7" stroke="none">OH</text>
  </g>
</g>
</svg>
